  else if (S(L('02').start, L('03').start)) { if (t > open) hud = T('STEPS', 80, 330, 28, .7, 300, 8) + T('13', 80, 390, 48, 1, 200, 8) + T('THEN A LANDING', 80, 440, 24, .6, 300, 8); }
  else if (S(L('03').start, L('04').start)) hud = T('LIGHT', 80, 330, 28, .7, 300, 8) + T('75 W', 80, 390, 48, 1, 200, 8) + T('MAXIMUM', 80, 440, 24, .6, 300, 8);
  else if (S(L('04').start, L('05').start)) hud = T('VISIBLE', 80, 330, 28, .7, 300, 8) + T('1.5 FLIGHTS', 80, 390, 44, 1, 200, 8);
  else if (S(L('05').start, outT)) {
    hud = T('LANDING', 80, 330, 28, .7, 300, 8) + T(String(landing).padStart(2, '0'), 80, 395, 52, 1, 200, 8, 'start', t >= runT ? '#ff8080' : '#e8ecf5') + T(`DEPTH   ${Math.round(depth)} m`, 80, 450, 26, .6, 300, 8);
    if (t < runT) hud += T('CRYING', 80, 520, 26, .7, 300, 8) + T('~200 m BELOW', 80, 568, 32, blink(t, 1.2), 300, 8, 'start', '#ff8080');
    if (t >= doorT) hud = T('DOOR', 80, 330, 28, .7, 300, 8) + T('LOCKED', 80, 390, 44, blink(t), 300, 8, 'start', '#ff8080') + T('FROM THE OUTSIDE', 80, 440, 24, .6, 300, 8);
  } else if (t >= outT && t < tEnd + .3) { const day = Math.min(14, 1 + Math.floor(clamp((t - outT) / Math.max(.5, tEnd - outT)) * 14)); hud = T('KNOCKING REPORTED', 80, 330, 26, .7, 300, 8) + T(`DAY ${day}`, 80, 395, 52, 1, 200, 8, 'start', '#ff8080'); }
  if (S(fiftyT - .12, fiftyT + .12) || S(hundredT - .12, hundredT + .12) || S(faceT - .06, faceT + .06)) over += `<rect width="${W}" height="${H}" fill="#000"/>`;
  if (t >= tEnd + .3) { over += `<rect width="${W}" height="${H}" fill="#000"/>`; hud = ''; }
  let g = DEFS(t) + `<rect width="${W}" height="${H}" fill="url(#vig)" opacity=".45"/>` + over + hud + caption(t) + endCard(t, TL.cardAt);
  document.getElementById('c').innerHTML = g;
};
</script></body></html>
