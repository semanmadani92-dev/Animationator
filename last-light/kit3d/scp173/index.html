// ---- floor: worn concrete tiles
{ const g = new THREE.PlaneGeometry(RW * 2, RD * 2, 14, 18).toNonIndexed(); g.rotateX(-Math.PI / 2);

  let i = 0;

{ const wl = new THREE.Mesh(new THREE.PlaneGeometry(RW * 2, RH), lam(0x4a4947)); wl.rotation.y = Math.PI; add(wl, 0, RH / 2, RD); }
add(new THREE.Mesh(new THREE.PlaneGeometry(RW * 2, RD * 2), lam(0x1c1c1e, { side: THREE.DoubleSide })), 0, RH, 0).rotation.x = Math.PI / 2;  // ceiling

for (let i = 0; i < 11; i++) {

// ---- the statue (original design): rough concrete, rebar, spray-painted face

  const hm = new THREE.Mesh(tint(rough(new THREE.CylinderGeometry(.24, .27, .4, 7, 2), .04), conc, .3), cm); head.add(hm);
  for (const sx of [-1, 1]) { part(new THREE.BoxGeometry(.46, .15, .19), sx * .46, 1.2, .02, sx * -.42);
    for (let k = 0; k < 2; k++) { const rb = new THREE.Mesh(new THREE.CylinderGeometry(.011, .011, .2, 4), lam(0x7a3f1f)); rb.position.set(sx * (.72 + k * .03), 1.06 + k * .05, .02 + k * .05); rb.rotation.z = sx * (1.1 + k * .3); g.add(rb); } }

}

  'scifi_megakit/Platforms/Door_DarkMetal.gltf', 'scifi_megakit/Platforms/Door_Frame_SquareTall.gltf', 'scifi_megakit/Props/Prop_Vent_Wide.gltf',

add(frame, .2, 0, RD - .05, Math.PI, KIT); const doorL = add(door, .2, 0, RD - .02, Math.PI, KIT);

// a mop: lives in the cleaner's hands once they arrive, leans on the bucket before

// warning signs and stencils (canvas textures)
function sign(lines, w, h, bg = '#d8c23a', fg = '#151515', font = 'bold 52px Inter, Arial') {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = Math.round(512 * h / w); const x = cv.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, cv.width, cv.height); x.fillStyle = fg; x.textAlign = 'center'; x.font = font;

add(sign(['SCP-173', 'MIN. 3 PERSONNEL', 'MAINTAIN EYE CONTACT'], .9, .55), -1.6, 1.75, RD - .02, Math.PI);

// security camera in the corner, with a blinking red LED
const camRig = new THREE.Group(); camRig.add(new THREE.Mesh(new THREE.BoxGeometry(.22, .12, .3), lam(0xd8d8d4))); const lens = new THREE.Mesh(new THREE.CylinderGeometry(.04, .04, .06, 8), lam(0x111111)); lens.rotation.x = Math.PI / 2; lens.position.z = .17; camRig.add(lens);

add(camRig, RW - .25, RH - .3, RD - .3).lookAt(-1, .5, -2);

// ---- people
const lib = await loadMannequins();
const me = makeHuman(lib, { number: 'D-4172' }), partner = makeHuman(lib, { number: 'D-4173', skin: 0x9a6a4e }), cleaner = makeHuman(lib, { number: 'D-4174', skin: 0xc79878 });
for (const h of [me, partner, cleaner]) add(h.root);
const faceTo = (h, x, z) => { h.root.rotation.y = Math.atan2(x - h.root.position.x, z - h.root.position.z); };
const POS = { me: [-.5, .9], partner: [.35, 1.05], cleaner: [1.4, -1.2] };

window.ready = true;
window.draw = function (t) {
  tNow = t; const L = id => ln(id), W_ = (id, re) => wordT(id, re);
  const fl0 = W_('09', /flicker/i), tEnd = L('12').end;

  const jumps = [[0, -2.2, -3.2, .5], [fl0 + .35, -1.7, -1.9, .4], [L('10').end + .3, -1.15, -.8, .3], [L('12').start + 1.6, -.85, -.3, .15]];

  // the three come in during line 05, then hold their positions

  const walkDur = 2.6;
  [[me, 'me', 0], [partner, 'partner', .35], [cleaner, 'cleaner', .7]].forEach(([h, k, delay]) => {
    h.root.visible = people;
    const [ex, ez] = POS[k], sx = .2 + delay * .6, sz = RD - .4;
    const w0 = inT + delay, w1 = w0 + walkDur, walking = t >= w0 && t < w1 && t >= inT;
    const u = t < inT ? 1 : clamp((t - w0) / walkDur);
    h.root.position.set(lerp(sx, ex, u), 0, lerp(sz, ez, u));
    if (walking) faceTo(h, ex, ez); else if (k === 'cleaner') faceTo(h, ex + .3, ez - 1); else faceTo(h, st.position.x, st.position.z);
    let segs;
    if (k === 'cleaner') {
      const scared = t >= W_('10', /scrapes/i);
      segs = t < inT ? [{ clip: 'Fixing_Kneeling', t0: -9 }] : [{ clip: 'Idle_Loop', t0: -9 }, { clip: 'Walk_Loop', t0: w0 }, { clip: 'Fixing_Kneeling', t0: w1 }];
      if (scared) segs.push({ clip: 'Idle_Loop', t0: W_('10', /scrapes/i) });
    } else {
      segs = t < inT ? [{ clip: 'Idle_Loop', t0: -9 }] : [{ clip: 'Idle_Loop', t0: -9 }, { clip: 'Walk_Loop', t0: w0 }, { clip: 'Idle_Loop', t0: w1 }];
    }

  });
  // mop follows the cleaner's hands once he's mopping

  if (mopping) { mop.position.set(2.1, 0, -1.45); mop.rotation.set(0, 0, .25); }
  else if (cleaner.root.visible && t >= inT) { mop.position.set(POS.cleaner[0] + .5, 0, POS.cleaner[1] - .3); mop.rotation.set(0, 0, 1.45); }  // dropped
  else { mop.position.set(2.1, 0, -1.45); mop.rotation.set(0, 0, .25); }

  let on = 1;
  if (t >= fl0 && t < tEnd + .15) { const u = t - fl0; on = u < 1.1 ? (Math.floor(u * 14) % 3 !== 0 ? 1 : 0) : ((u % .85) < .1 ? 0 : 1); }
  for (const j of jumps.slice(1)) if (t >= j[0] - .14 && t < j[0] + .1) on = 0;
  lights.forEach(l => l.intensity = 13 * on); spot.intensity = 26 * on; fl.intensity = on ? .55 : .05;
  tubes.forEach(tb => tb.material.color.setHex(on ? 0xeef4ff : 0x202428));
  led.visible = Math.floor(t * 1.5) % 2 === 0; doorLight.intensity = t >= fl0 ? (Math.floor(t * 3) % 2) * 1.5 : 0;
  // ---- camera, shot by shot
  const S = (a, b) => t >= a && t < b, V = (x, y, z) => new THREE.Vector3(x, y, z);
  const headOf = h => h.bone('Head').getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, .1, 0));
  let pos, look, fov = 50, burn = 0, shake = 0;

  if (t < L('02').start) {  // his face, slow push
    const hp = headOf(me), k = prog('01'); const dir = V(sh.x - hp.x, 0, sh.z - hp.z).normalize();
    pos = hp.clone().addScaledVector(dir, lerp(1.4, .75, ease(k))).add(V(.15, .02, 0)); look = hp.clone().add(V(0, -.02, 0)); fov = 40;
  } else if (t < L('03').start) {  // the room tour: padded wall, drain, mop and bucket, the corner
    const a = W_('02', /drain/i), b = W_('02', /mop/i), c = W_('02', /corner/i);
    const keys = [[L('02').start, V(2.6, 1.7, 3.6), V(-3.4, 1.4, -1.5)], [a, V(1.0, .9, -.3), V(.4, 0, -1.3)], [b, V(2.9, .9, -.4), V(1.9, .3, -1.6)], [c, V(.3, 1.6, .6), V(-2.2, 1.2, -3.2)], [L('03').start, V(-.6, 1.5, -1.2), V(-2.2, 1.4, -3.2)]];
    let i = 0; for (let k = 0; k < keys.length - 1; k++) if (t >= keys[k][0]) i = k;
    const u = ease((t - keys[i][0]) / Math.max(.1, keys[i + 1][0] - keys[i][0]));
    pos = keys[i][1].clone().lerp(keys[i + 1][1], u); look = keys[i][2].clone().lerp(keys[i + 1][2], u);
  } else if (t < L('04').start) {  // statue details: low body, rebar arm, face
    const a = W_('03', /rebar/i), b = W_('03', /spray/i);
    if (t < a) { pos = V(sh.x + .9, .35, sh.z + 1.4); look = V(sh.x, .9, sh.z); }
    else if (t < b) { pos = V(sh.x + 1.0, 1.35, sh.z + .8); look = V(sh.x + .55, 1.15, sh.z); }
    else { const k = (t - b) / 2; pos = V(sh.x + .35, 1.85, sh.z + lerp(1.3, .95, k)); look = sHead.clone(); fov = 38; }
  } else if (t < L('05').start) {  // it can't move while watched: wide, empty room, statue in the light
    pos = V(1.6, 1.65, 3.2); look = V(-1.6, 1.1, -2.6); fov = 46;
  } else if (t < L('06').start) {  // three come in: from behind the statue toward the door
    pos = V(sh.x + .5, 1.75, sh.z - .35); look = V(.4, 1.0, 2.2); fov = 52;
  } else if (t < L('07').start) {  // the stained floor, mop at work
    const c = cleaner.root.position; pos = V(c.x + 1.5, 1.45, c.z - 2.3); look = V(c.x - .1, .3, c.z + .1); fov = 50;
  } else if (t < L('08').start) {  // forty seconds: his face from the statue's side
    const hp = headOf(me), dir = V(sh.x - hp.x, 0, sh.z - hp.z).normalize(); pos = hp.clone().addScaledVector(dir, .62).add(V(-.06, 0, 0)); look = hp; fov = 38;
    burn = .35;
  } else if (t < L('09').start) {  // partner beside him
    const hp = headOf(partner), dir = V(sh.x - hp.x, 0, sh.z - hp.z).normalize(); pos = hp.clone().addScaledVector(dir, .75).add(V(.12, .02, 0)); look = hp.clone().add(V(-.1, -.06, 0)); fov = 40;
    burn = .4;
  } else {  // POV from his eyes
    const hp = headOf(me), k = clamp((t - L('09').start) / (tEnd - L('09').start));
    pos = hp.clone().add(V(0, .02, 0)); look = V(sh.x, 1.55 + .2 * k, sh.z); fov = lerp(48, 40, k); burn = .45 + .5 * k; shake = .006 + .012 * k;
    if (S(L('10').start, L('11').start)) { pos = V(sh.x + .8, .22, sh.z + 1.2); look = V(sh.x, .3, sh.z); fov = 50; burn = .5; }  // the floor scrape
  }
  pos.add(V(Math.sin(t * 13) * shake, Math.sin(t * 9.7) * shake, 0));
  cam.fov = fov; cam.updateProjectionMatrix(); cam.position.copy(pos); cam.lookAt(look);
  // the jump scare: a split second of its face right in front of you
  const scare = t >= tEnd + .15 && t < tEnd + .5;
  if (scare) { on = 1; lights.forEach(l => l.intensity = 13); spot.intensity = 26; st.position.set(pos.x + .0, 0, pos.z - .9); const d = V(cam.position.x - st.position.x, 0, cam.position.z - st.position.z); st.rotation.y = Math.atan2(d.x, d.z); cam.lookAt(st.position.x, 1.75, st.position.z); burn = .9; }
  retro.u.burn.value = burn; retro.render(scene, cam, t);
  // ---- HUD
  let hud = '', over = '';
  if (t < L('02').start) hud = title('SCP-173', 'EUCLID') + T('NARRATED BY', 80, 330, 24, .55, 300, 8) + T('D-4172', 80, 372, 32, .9, 300, 10, 'start', '#f0a060');
  else if (t < L('04').start && t >= L('03').start) ['CONCRETE', 'REBAR', 'KRYLON SPRAY PAINT'].forEach((w, i) => { if (prog('03') > i * .28) hud += T(w, 80, 330 + i * 52, 32, .8, 300, 8); });
  else if (S(L('04').start, L('05').start)) hud = T('LINE OF SIGHT', 80, 330, 30, .7, 300, 8) + T('MAINTAINED', 80, 380, 30, 1, 300, 8, 'start', '#9fe0a0');
  else if (S(L('05').start, L('07').start)) hud = T('PERSONNEL', 80, 330, 30, .7, 300, 8) + T(String(Math.min(3, 1 + Math.floor(clamp((t - L('05').start) / 2.2) * 2.99))), 80, 395, 52, 1, 200, 8);
  else if (t >= L('07').start && t < tEnd + .15) {
    const open = 40 + (t - L('07').start);
    hud = T('EYES OPEN', 80, 330, 30, .7, 300, 8) + T(`00:${String(Math.floor(open / 60)).padStart(2, '0')}:${String(Math.floor(open) % 60).padStart(2, '0')}`, 80, 395, 52, 1, 200, 8, 'start', open > 45 ? '#ff8080' : '#e8ecf5');
    if (t >= L('08').start) hud += T('PARTNER', 80, 465, 28, .7, 300, 8) + T('BLINKING', 80, 512, 32, blink(t), 300, 8, 'start', '#ff8080');
    if (t >= L('09').start) { const d = Math.hypot(sh.x - me.root.position.x, sh.z - me.root.position.z); hud += T('DISTANCE', 80, 585, 28, .7, 300, 8) + T(d.toFixed(1) + ' m', 80, 640, 44, 1, 200, 8, 'start', d < 2 ? '#ff8080' : '#e8ecf5'); }
  }
  if (t >= L('11').start) for (let i = 0; i < 3; i++) over += `<ellipse cx="${300 + i * 260}" cy="${1820 - ((t * 60 + i * 90) % 300)}" rx="24" ry="40" fill="#cfe0ff" opacity=".12" filter="url(#soft)"/>`;
  if (t >= L('12').start && !scare) {  // eyelids closing
    const k = clamp((t - L('12').start) / (tEnd - L('12').start + .2)), lid = 960 * ease(k) * (.75 + .25 * Math.abs(Math.sin(t * 6)));
    over += `<rect width="${W}" height="${lid}" fill="#000"/><rect y="${H - lid}" width="${W}" height="${lid}" fill="#000"/>`;
  }
  if (t >= tEnd + .15 && !scare) { over += `<rect width="${W}" height="${H}" fill="#000"/>`; hud = ''; }
  if (scare) hud = '';
  let g = DEFS(t) + `<rect width="${W}" height="${H}" fill="url(#vig)" opacity=".45"/>` + over + hud;
  if (on && !scare) g += caption(t);
  g += endCard(t, TL.cardAt);
  document.getElementById('c').innerHTML = g;
};
