<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Zeke bedroom preview</title>
<style>
  @font-face {
    font-family: "Nunito";
    font-weight: 900;
    src: url("/node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2") format("woff2");
  }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: absolute; inset: 0; }
  .caption {
    position: absolute; left: 0; right: 0; top: 1300px; text-align: center;
    font-family: "Nunito", sans-serif; font-weight: 900; line-height: 1.0;
    -webkit-text-stroke: 16px #0b0b0f; paint-order: stroke fill;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,.35));
  }
  .caption .l1 { font-size: 84px; color: #fff; }
  .caption .l2 { font-size: 104px; letter-spacing: 1px; }
</style>
<script type="importmap">{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }</script>
</head>
<body>
<div id="stage"></div>
<div class="caption"><div class="l1" id="l1"></div><div class="l2" id="l2"></div></div>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { BokehPass } from "three/addons/postprocessing/BokehPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { createZeke } from "/characters/zeke.js";
import { createBedroom, lightBedroom } from "/scenes/bedroom.js";

await document.fonts.load("900 100px Nunito");
const q = new URLSearchParams(location.search);
const shot = q.get("shot") || "stand";
document.getElementById("l1").textContent = q.get("l1") || "a boy named";
const l2 = document.getElementById("l2");
l2.textContent = q.get("l2") || "ZEKE";
l2.style.color = q.get("l2Color") || "#39d353";

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.getElementById("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
lightBedroom(scene, renderer, RoomEnvironment);
const { group: room, bed } = createBedroom();
scene.add(room);

const zeke = createZeke({
  expression: q.get("expr") || "determined",
  number: q.get("num") || "0%",
  numberColor: q.get("numColor") || "#ff4040",
});
scene.add(zeke.group);

const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);
let focus;
if (shot === "bed") {
  // just woke up: sitting up in bed, legs under the blanket, one hand rubbing an eye
  zeke.legL.visible = zeke.legR.visible = false;
  zeke.group.position.set(1.2, -0.15, -1.6); // torso bottom rests on the mattress (y ~0.95)
  zeke.group.rotation.y = -0.25;
  zeke.head.rotation.z = 0.12;
  zeke.armR.rotation.x = -2.0;
  zeke.armR.rotation.z = -0.55;
  camera.position.set(-1.2, 2.8, 4.9);
  focus = new THREE.Vector3(1.2, 2.2, -1.6);
} else {
  // standing on the bed, arms up
  zeke.group.position.set(1.2, 1.1, -0.6);
  zeke.group.rotation.y = -0.2;
  if (zeke.expression === "happy") {
    zeke.armL.rotation.z = -2.85;
    zeke.armR.rotation.z = 2.85;
  }
  camera.position.set(-0.4, 2.9, 9.0);
  focus = new THREE.Vector3(1.1, 2.9, -0.6);
}
camera.lookAt(focus);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new BokehPass(scene, camera, {
  focus: camera.position.distanceTo(focus), aperture: 0.0035, maxblur: 0.008,
}));
composer.addPass(new OutputPass());
composer.render();
window.__ready = true;
</script>
</body>
</html>
