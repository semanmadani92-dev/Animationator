<!doctype html><html><body style="margin:0"><canvas id="c" width="1200" height="400"></canvas>
<script type="importmap">{"imports":{"three":"./three.module.js","three/addons/":"./jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'; import * as SU from 'three/addons/utils/SkeletonUtils.js';
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), preserveDrawingBuffer: true, antialias: true });
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x202226);
sc.add(new THREE.HemisphereLight(0xffffff, 0x333333, 2)); const d = new THREE.DirectionalLight(0xffffff, 2); d.position.set(2, 4, 3); sc.add(d);
const g = await new GLTFLoader().loadAsync('glb/anim/UAL1_mannequin_46anims.glb');
const names = ['Walk_Loop', 'Sprint_Loop', 'Idle_Torch_Loop', 'Crouch_Fwd_Loop', 'Death01', 'Hit_Head'];
names.forEach((n, i) => { const m = SU.clone(g.scene); m.position.x = (i - 2.5) * 1.3; sc.add(m);
  const mx = new THREE.AnimationMixer(m); mx.clipAction(THREE.AnimationClip.findByName(g.animations, n)).play(); mx.setTime(n === 'Death01' ? 2.5 : 0.4); });
const cam = new THREE.PerspectiveCamera(30, 3, .1, 100); cam.position.set(0, 1.6, 9); cam.lookAt(0, .9, 0); r.render(sc, cam); window.ready = true;
</script></body></html>
